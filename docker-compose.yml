services:
  pmt_faq_bot:
    image: ${PMT_FAQ_BOT_IMAGE:-pmt_faq_bot:latest}
    build:
      context: ./pmt_faq_bot
    container_name: ${PMT_FAQ_BOT_CONTAINER_NAME:-pmt_faq_bot}
    networks:
      pmt-faq-app-net:
        aliases:
          - pmt_faq_bot
    ports:
      - "${RAG_API_BIND_HOST:-127.0.0.1}:${RAG_API_DEBUG_PORT:-8090}:8088"
    volumes:
      - ${EXPORT_DIR:-./export}:/data/export:ro
    environment:
      - QDRANT_URL=${QDRANT_URL:-http://10.203.97.4:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - EMBEDDING_URL=${EMBEDDING_URL:-http://10.203.97.4:8001}
      - EMBED_DIM=${EMBED_DIM:-0}
      - RERANK_URL=${RERANK_URL:-http://10.203.97.4:8002}
      - LLM_URL=${LLM_URL:-http://10.203.97.4:8000}
      - LLM_MODEL=${LLM_MODEL:-Qwen3-235B-A22B-Instruct-2507}
      - COLLECTION_NAME=${COLLECTION_NAME:-PMT-FAQ}
      - ENABLE_BM25=${ENABLE_BM25:-true}
      - RAG_SCORE_THRESHOLD=${RAG_SCORE_THRESHOLD:-0.3}
      - RAG_MODEL_NAME=${RAG_MODEL_NAME:-pmt_faq_bot}
      - HISTORY_MAX_TURNS=${HISTORY_MAX_TURNS:-4}
      - RAG_ASSET_DIR=${RAG_ASSET_DIR:-/data/export}
      - "RAG_ASSET_BASE_URL=${RAG_ASSET_BASE_URL:-http://127.0.0.1:${RAG_API_DEBUG_PORT:-8090}/assets/confluence}"
      - MAX_IMAGES_PER_ANSWER=${MAX_IMAGES_PER_ANSWER:-3}
    command:
      - serve
      - --port
      - "8088"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8088/healthz',timeout=5).status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:main}
    container_name: ${OPEN_WEBUI_CONTAINER_NAME:-pmt-faq-open-webui}
    networks:
      - pmt-faq-app-net
    ports:
      - "${OPEN_WEBUI_BIND_HOST:-0.0.0.0}:${WEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      - OPENAI_API_BASE_URLS=${OPENAI_API_BASE_URLS:-http://10.203.97.4:8000/v1;http://pmt_faq_bot:8088/v1}
      - OPENAI_API_KEYS=${OPENAI_API_KEYS:-none;none}
      - WEBUI_AUTH=${WEBUI_AUTH:-false}
    depends_on:
      pmt_faq_bot:
        condition: service_healthy
    restart: unless-stopped

  pmt_faq_bot_ingest:
    image: ${PMT_FAQ_BOT_IMAGE:-pmt_faq_bot:latest}
    build:
      context: ./pmt_faq_bot
    container_name: ${PMT_FAQ_BOT_INGEST_CONTAINER_NAME:-pmt_faq_bot_ingest}
    profiles:
      - ingest
    networks:
      - pmt-faq-app-net
    volumes:
      - ${EXPORT_DIR:-./export}:/data/export:ro
      - ${DOCUMENTS_DIR:-./documents}:/data/documents:ro
      - ${LOG_DIR:-./logs}:/data/logs
    environment:
      - QDRANT_URL=${QDRANT_URL:-http://10.203.97.4:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - EMBEDDING_URL=${EMBEDDING_URL:-http://10.203.97.4:8001}
      - EMBED_DIM=${EMBED_DIM:-0}
      - COLLECTION_NAME=${COLLECTION_NAME:-PMT-FAQ}
      - BATCH_SIZE=${BATCH_SIZE:-128}
      - ENABLE_BM25=${ENABLE_BM25:-true}
    command:
      - ingest
      - --source
      - ${INGEST_SOURCE_DIR:-/data/export/documents}
      - --mode
      - ${INGEST_MODE:-auto}
      - --log-dir
      - /data/logs

  pmt_faq_bot_image_process:
    image: ${PMT_FAQ_BOT_IMAGE:-pmt_faq_bot:latest}
    build:
      context: ./pmt_faq_bot
    container_name: ${PMT_FAQ_BOT_IMAGE_PROCESS_CONTAINER_NAME:-pmt_faq_bot_image_process}
    profiles:
      - image-processing
    networks:
      - pmt-faq-app-net
    volumes:
      - ${EXPORT_DIR:-./export}:/data/export
    environment:
      - IMAGE_VLM_URL=${IMAGE_VLM_URL:-}
      - IMAGE_CAPTION_MODEL=${IMAGE_CAPTION_MODEL:-Qwen/Qwen3-VL-4B-Instruct}
      - IMAGE_VLM_TIMEOUT=${IMAGE_VLM_TIMEOUT:-120}
    command:
      - process-images
      - --export-dir
      - /data/export
      - --ocr-engine
      - ${IMAGE_OCR_ENGINE:-paddleocr}
      - --ocr-version
      - ${IMAGE_OCR_VERSION:-unknown}
      - --caption-model
      - ${IMAGE_CAPTION_MODEL:-Qwen/Qwen3-VL-4B-Instruct}
      - --vlm-url
      - "${IMAGE_VLM_URL:-}"
      - --vlm-timeout
      - ${IMAGE_VLM_TIMEOUT:-120}

networks:
  pmt-faq-app-net:
    name: pmt-faq-app-net

volumes:
  open-webui-data:
